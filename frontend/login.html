<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Enterprise Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="container" style="max-width: 440px;">
    <div class="enterprise-card p-4">
      <div class="text-center mb-4">
        <h2 class="h4 fw-bold text-white">Enterprise Portal Login</h2>
        <p class="text-secondary small">Access workforce tools, projects, and AI assistant</p>
      </div>

      <div class="p-3 mb-3 rounded-3 bg-dark border border-secondary">
        <div class="text-muted small fw-bold mb-2">QUICK TEST CREDENTIALS:</div>
        <div class="d-grid gap-1">
          <button class="btn btn-sm btn-outline-info text-start" onclick="fillCreds('admin@enterprise.ai')">
            👑 <strong>Admin:</strong> admin@enterprise.ai / admin123
          </button>
          <button class="btn btn-sm btn-outline-primary text-start" onclick="fillCreds('sarah.tech@enterprise.ai')">
            💼 <strong>Manager:</strong> sarah.tech@enterprise.ai / manager123
          </button>
          <button class="btn btn-sm btn-outline-success text-start" onclick="fillCreds('alex.dev@enterprise.ai')">
            👤 <strong>Employee:</strong> alex.dev@enterprise.ai / employee123
          </button>
        </div>
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="form-label small text-secondary">Corporate Email</label>
          <input type="email" id="email" class="form-control bg-dark text-white border-secondary" required placeholder="name@enterprise.ai">
        </div>
        <div class="mb-3">
          <label class="form-label small text-secondary">Password</label>
          <input type="password" id="password" class="form-control bg-dark text-white border-secondary" required value="admin123">
        </div>
        <button type="submit" class="btn btn-primary w-full py-2 fw-bold w-100 mb-3">Sign In to Dashboard</button>
      </form>
      <div class="text-center">
        <a href="dashboard.html" class="text-secondary small text-decoration-none">← Skip to Guest Dashboard</a>
      </div>
    </div>
  </div>

  <script>
    function fillCreds(e) {
      document.getElementById('email').value = e;
    }
    function handleLogin(e) {
      e.preventDefault();
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
